name: Power Platform Deployment Pipeline

on:
  workflow_dispatch: # allows manual trigger
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest
    env:
      PP_SOLUTION_NAME: ${{ vars.PP_SOLUTION_NAME }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Validate solution configuration
      shell: pwsh
      run: |
        if ([string]::IsNullOrWhiteSpace($env:PP_SOLUTION_NAME)) {
          throw "Repository variable PP_SOLUTION_NAME must be set to the solution unique name."
        }

    # Step 1: Install Power Platform CLI via .NET
    - name: Install Power Platform CLI via .NET
      shell: pwsh
      run: |
        dotnet tool install --global Microsoft.PowerApps.CLI.Tool
        if ($LASTEXITCODE -ne 0) {
          throw "Power Platform CLI installation failed with exit code $LASTEXITCODE."
        }
        $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
        pac
        if ($LASTEXITCODE -ne 0) {
          throw "Power Platform CLI check failed with exit code $LASTEXITCODE."
        }

    # Step 2: Authenticate using Service Principal
    - name: Authenticate to Power Platform
      shell: pwsh
      run: |
        pac auth create --environment $env:PP_ENV_URL `
                        --applicationId $env:PP_APP_ID `
                        --clientSecret $env:PP_CLIENT_SECRET `
                        --tenant $env:PP_TENANT_ID
        if ($LASTEXITCODE -ne 0) {
          throw "Dev environment authentication failed with exit code $LASTEXITCODE."
        }
      env:
        PP_ENV_URL: ${{ secrets.PP_ENV_URL }}
        PP_APP_ID: ${{ secrets.PP_APP_ID }}
        PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}

    
    # Step 3: Export solution from Dev
    - name: Export solutions from Dev
      shell: pwsh
      run: |
        $solutionName = $env:PP_SOLUTION_NAME
        $solutionsPath = Join-Path (Resolve-Path .).Path "Solutions"
        New-Item -ItemType Directory -Path $solutionsPath -Force | Out-Null
        $exportPath = Join-Path $solutionsPath "$solutionName.zip"
        pac solution export --name $solutionName --path $exportPath --managed false --overwrite
        if ($LASTEXITCODE -ne 0) {
          throw "Solution export failed with exit code $LASTEXITCODE."
        }
        Write-Host "Solution exported successfully from Dev!"

    # Step 3.1: Rename exported solution for Test import
    - name: Rename exported solution
      shell: pwsh
      run: |
        $solutionsPath = Join-Path (Resolve-Path .).Path "Solutions"
        $sourcePath = Join-Path $solutionsPath "$env:PP_SOLUTION_NAME.zip"
        $targetPath = Join-Path $solutionsPath "$($env:PP_SOLUTION_NAME)Target.zip"
        Rename-Item -Path $sourcePath -NewName (Split-Path $targetPath -Leaf)
        Write-Host "✅ Solution renamed to $([System.IO.Path]::GetFileName($targetPath))"

    # Step 3.4: Download and extract SolutionPackager.exe from NuGet
    - name: Download SolutionPackager.exe
      shell: pwsh
      run: |
        $toolsPath = "$(Resolve-Path .)\tools"
        if (!(Test-Path $toolsPath)) {
          New-Item -ItemType Directory -Path $toolsPath | Out-Null
        }

        $nugetUrl = "https://www.nuget.org/api/v2/package/Microsoft.CrmSdk.CoreTools"
        $downloadPath = "$toolsPath\CoreTools.nupkg"
        $extractPath = "$toolsPath\CoreTools"

        Invoke-WebRequest -Uri $nugetUrl -OutFile $downloadPath
        Expand-Archive -Path $downloadPath -DestinationPath $extractPath -Force

        $solutionPackagerPath = "$extractPath\content\bin\coretools\SolutionPackager.exe"
        if (!(Test-Path $solutionPackagerPath)) {
          throw "❌ SolutionPackager.exe not found after extraction."
        }

        Write-Host "✅ SolutionPackager.exe downloaded to $solutionPackagerPath"


    # Step 3.5: Unpack solution before validation
    - name: Unpack solution using SolutionPackager
      shell: pwsh
      run: |
        $repositoryPath = (Resolve-Path .).Path
        $solutionZip = Join-Path (Join-Path $repositoryPath "Solutions") "$($env:PP_SOLUTION_NAME)Target.zip"
        $unpackPath = Join-Path $repositoryPath "UnpackedSolution"
        $solutionPackagerPath = Join-Path $repositoryPath "tools\CoreTools\content\bin\coretools\SolutionPackager.exe"
        
        if (!(Test-Path $solutionPackagerPath)) {
          throw "SolutionPackager.exe not found at $solutionPackagerPath"
        }

        & $solutionPackagerPath /action:Extract /zipfile:$solutionZip /folder:$unpackPath /packagetype:Unmanaged
        Write-Host "✅ Solution unpacked to $unpackPath"

    # Step 4: Run Best Practice Validation
    - name: Run Best Practice Validation
      shell: pwsh
      run: |
        $repositoryPath = (Resolve-Path .).Path
        $solutionPath = Join-Path $repositoryPath "UnpackedSolution"
        $solutionZip = Join-Path (Join-Path $repositoryPath "Solutions") "$($env:PP_SOLUTION_NAME)Target.zip"
        $solutionPackagerPath = Join-Path $repositoryPath "tools\SolutionPackager.exe"

        pwsh ./scripts/validate-solution.ps1 `
          -solutionPath $solutionPath `
          -solutionZip $solutionZip `
          -solutionPackagerPath $solutionPackagerPath

    # Step 5: Import solution to Test
    - name: Import solution to Test
      if: success()
      shell: pwsh
      run: |
        pac auth create --environment $env:PP_ENV_TEST_URL `
                        --applicationId $env:PP_APP_ID `
                        --clientSecret $env:PP_CLIENT_SECRET `
                        --tenant $env:PP_TENANT_ID
        if ($LASTEXITCODE -ne 0) {
          throw "Test environment authentication failed with exit code $LASTEXITCODE."
        }
        $solutionsPath = Join-Path (Resolve-Path .).Path "Solutions"
        $solutionZip = Join-Path $solutionsPath "$($env:PP_SOLUTION_NAME)Target.zip"
        pac solution import --path $solutionZip --force-overwrite --publish-changes
        if ($LASTEXITCODE -ne 0) {
          throw "Solution import failed with exit code $LASTEXITCODE."
        }
        Write-Host "Successfully deployed to Test environment."
      env:
        PP_ENV_TEST_URL: ${{ secrets.PP_ENV_TEST_URL }}
        PP_APP_ID: ${{ secrets.PP_APP_ID }}
        PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
        PP_TENANT_ID: ${{ secrets.PP_TENANT_ID }}
